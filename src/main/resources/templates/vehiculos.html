<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Parqueadero</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/vehiculos}">Vehículos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/espacios}">Espacios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/movimientos}">Movimientos</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Gestión de Vehículos</h2>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form th:action="@{/panel/vehiculos}" th:object="${nuevoVehiculo}" method="post" class="row g-3">
                <div class="col-md-4">
                    <input type="text" th:field="*{placa}" class="form-control" placeholder="Placa" required>
                </div>
                <div class="col-md-4">
                    <input type="text" th:field="*{marca}" class="form-control" placeholder="Marca" required>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{nombrePropietario}" class="form-control" placeholder="Nombre del dueño" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Dueño</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vehiculos}">
                        <td th:text="${v.placa}"></td>
                        <td th:text="${v.marca}"></td>
                        <td th:text="${v.nombrePropietario}"></td>
                        <td>
                            <a th:href="@{/panel/vehiculos/eliminar/{placa}(placa=${v.placa})}" class="btn btn-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
