<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Parqueadero</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/vehiculos}">Vehículos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/espacios}">Espacios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/movimientos}">Movimientos</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Registro de Entradas y Salidas</h2>
    <div class="card p-4 mb-4 shadow">
        <form th:action="@{/panel/movimientos}" th:object="${nuevoMovimiento}" method="post" class="row g-3">
            <div class="col-md-10">
                <input type="text" th:field="*{placa}" class="form-control" placeholder="Placa del vehículo" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Registrar Entrada</button>
            </div>
        </form>
    </div>

    <table class="table table-bordered text-center shadow bg-white">
        <thead class="table-dark">
            <tr>
                <th>Placa</th>
                <th>Espacio</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${movimientos}">
                <td th:text="${m.placa}"></td>
                <td th:text="${m.espacioAsignado}"></td>
                <td th:text="${#temporals.format(m.fechaEntrada, 'HH:mm')}"></td>
                <td th:text="${m.fechaSalida != null ? #temporals.format(m.fechaSalida, 'HH:mm') : '-'}"></td>
                <td th:text="${m.valorPagado != null ? '$' + m.valorPagado : '-'}"></td>
                <td th:text="${m.estado}" th:class="${m.estado == 'ACTIVO' ? 'text-success fw-bold' : 'text-secondary fw-bold'}"></td>
                <td>
                    <a th:if="${m.estado == 'ACTIVO'}" th:href="@{/panel/movimientos/salida/{id}(id=${m.id})}" class="btn btn-warning btn-sm">Dar Salida</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
