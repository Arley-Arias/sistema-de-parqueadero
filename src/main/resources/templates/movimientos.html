<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ParkAdmin - Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table { border-radius: 8px; overflow: hidden; vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"><i class="fa-solid fa-square-parking"></i> ParkAdmin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/vehiculos}"><i class="fa-solid fa-car"></i> Carros/Motos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/espacios}"><i class="fa-solid fa-border-all"></i> Puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/panel/movimientos}"><i class="fa-solid fa-right-left"></i> Entradas/Salidas</a>
                </li>

                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/propietarios}"><i class="fa-solid fa-users"></i> Dueños</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/reportes}"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" th:if="${esAdmin}">
                    <a class="nav-link text-warning fw-bold" th:href="@{/panel/configuracion}"><i class="fa-solid fa-gear"></i> Ajustes</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button class="btn btn-light btn-sm fw-bold rounded-pill px-3 mt-1" type="submit">
                            <i class="fa-solid fa-power-off text-danger"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-primary fw-bold"><i class="fa-solid fa-right-left me-2"></i> Registro de Movimientos</h2>
    
    <div class="card shadow mb-5 border-top border-primary border-4">
        <div class="card-body p-4">
            <form th:action="@{/panel/movimientos}" th:object="${nuevoMovimiento}" method="post" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label fw-bold text-secondary">Placa del Vehículo</label>
                    <input type="text" th:field="*{placa}" class="form-control form-control-lg" placeholder="Ej: ABC-123" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold text-secondary">Asignar Puesto</label>
                    <select th:field="*{espacioAsignado}" class="form-select form-select-lg" required>
                        <option value="" disabled selected>Seleccione un espacio libre...</option>
                        <option th:each="espacio : ${espaciosDisponibles}" 
                                th:value="${espacio.numero}" 
                                th:text="'Puesto ' + ${espacio.numero}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingreso
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover text-center mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="fa-solid fa-hashtag text-muted"></i> Placa</th>
                        <th><i class="fa-solid fa-border-all text-muted"></i> Espacio</th>
                        <th><i class="fa-solid fa-clock text-muted"></i> Entrada</th>
                        <th><i class="fa-regular fa-clock text-muted"></i> Salida</th>
                        <th><i class="fa-solid fa-sack-dollar text-muted"></i> Total</th>
                        <th><i class="fa-solid fa-circle-info text-muted"></i> Estado</th>
                        <th><i class="fa-solid fa-gears text-muted"></i> Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${movimientos}">
                        <td class="fw-bold" th:text="${m.placa}"></td>
                        <td><span class="badge bg-dark rounded-pill px-2" th:text="${m.espacioAsignado}"></span></td>
                        <td class="text-success fw-bold" th:text="${#temporals.format(m.fechaEntrada, 'HH:mm')}"></td>
                        <td class="text-danger fw-bold" th:text="${m.fechaSalida != null ? #temporals.format(m.fechaSalida, 'HH:mm') : '-'}"></td>
                        <td class="fw-bold text-primary" th:text="${m.valorPagado != null ? '$' + m.valorPagado : '-'}"></td>
                        <td>
                            <span th:if="${m.estado == 'ACTIVO'}" class="badge bg-success rounded-pill px-3"><i class="fa-solid fa-spinner fa-spin-pulse"></i> Parqueado</span>
                            <span th:if="${m.estado == 'FINALIZADO'}" class="badge bg-secondary rounded-pill px-3"><i class="fa-solid fa-check"></i> Salió</span>
                        </td>
                        <td>
                            <a th:if="${m.estado == 'ACTIVO'}" th:href="@{/panel/movimientos/salida/{id}(id=${m.id})}" class="btn btn-warning btn-sm shadow-sm fw-bold">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> Dar Salida
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
