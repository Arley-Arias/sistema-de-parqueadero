<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Propietarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table { border-radius: 8px; overflow: hidden; vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"><i class="fa-solid fa-square-parking"></i> ParkAdmin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/vehiculos}"><i class="fa-solid fa-car"></i> Carros/Motos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/espacios}"><i class="fa-solid fa-border-all"></i> Puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/movimientos}"><i class="fa-solid fa-right-left"></i> Entradas/Salidas</a>
                </li>

                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link active" th:href="@{/panel/propietarios}"><i class="fa-solid fa-users"></i> Dueños</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/reportes}"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" th:if="${esAdmin}">
                    <a class="nav-link text-warning fw-bold" th:href="@{/panel/configuracion}"><i class="fa-solid fa-gear"></i> Ajustes</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button class="btn btn-light btn-sm fw-bold rounded-pill px-3 mt-1" type="submit">
                            <i class="fa-solid fa-power-off text-danger"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-primary fw-bold"><i class="fa-solid fa-users me-2"></i> Gestión de Propietarios</h2>
    
    <div class="card shadow mb-5 border-top border-primary border-4">
        <div class="card-body p-4">
            <form th:action="@{/panel/propietarios}" th:object="${nuevoPropietario}" method="post" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary">Documento</label>
                    <input type="text" th:field="*{documento}" class="form-control" placeholder="Ej: 10102020" required th:readonly="${nuevoPropietario.documento != null}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombres y apellidos" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary">Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control" placeholder="Celular" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100" title="Guardar">
                        <i class="fa-solid fa-floppy-disk"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover text-center mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="fa-regular fa-id-card text-muted"></i> Documento</th>
                        <th><i class="fa-solid fa-user text-muted"></i> Nombre</th>
                        <th><i class="fa-solid fa-phone text-muted"></i> Teléfono</th>
                        <th><i class="fa-solid fa-gears text-muted"></i> Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${propietarios}">
                        <td class="fw-bold" th:text="${p.documento}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td>
                            <a th:href="@{/panel/propietarios/editar/{documento}(documento=${p.documento})}" class="btn btn-warning btn-sm shadow-sm" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{/panel/propietarios/eliminar/{documento}(documento=${p.documento})}" class="btn btn-danger btn-sm shadow-sm" title="Eliminar">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
