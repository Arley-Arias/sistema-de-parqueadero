<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ParkAdmin - Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"><i class="fa-solid fa-square-parking"></i> ParkAdmin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/vehiculos}"><i class="fa-solid fa-car"></i> Carros/Motos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/espacios}"><i class="fa-solid fa-border-all"></i> Puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/movimientos}"><i class="fa-solid fa-right-left"></i> Entradas/Salidas</a>
                </li>

                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/propietarios}"><i class="fa-solid fa-users"></i> Dueños</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/reportes}"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" th:if="${esAdmin}">
                    <a class="nav-link text-warning fw-bold active border-bottom border-warning border-3" th:href="@{/panel/configuracion}"><i class="fa-solid fa-gear"></i> Ajustes</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button class="btn btn-light btn-sm fw-bold rounded-pill px-3 mt-1" type="submit">
                            <i class="fa-solid fa-power-off text-danger"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="w-100" style="max-width: 500px;">
        <h2 class="mb-4 text-primary fw-bold text-center"><i class="fa-solid fa-sliders me-2"></i> Configuración del Sistema</h2>
        
        <div class="card p-5 mt-3 shadow border-top border-warning border-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-money-bill-wave fa-3x text-success mb-3"></i>
                <h5 class="fw-bold text-secondary">Ajuste de Tarifas</h5>
                <p class="text-muted small">Modifica el valor a cobrar por cada minuto de permanencia en el parqueadero.</p>
            </div>
            
            <form th:action="@{/panel/configuracion}" th:object="${tarifa}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Valor por Minuto</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-light fw-bold text-success">$</span>
                        <input type="number" step="0.01" th:field="*{valorMinuto}" class="form-control text-center fw-bold fs-4" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm">
                    <i class="fa-solid fa-check me-2"></i> Guardar Tarifa
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
