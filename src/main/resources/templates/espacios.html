<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Parqueadero</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/vehiculos}">Vehículos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/espacios}">Espacios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/panel/movimientos}">Movimientos</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Gestión de Espacios</h2>
    <div class="card p-4 mb-4 shadow">
        <form th:action="@{/panel/espacios}" th:object="${nuevoEspacio}" method="post" class="row g-3">
            <div class="col-md-10">
                <input type="text" th:field="*{numero}" class="form-control" placeholder="Ej: A1" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Agregar</button>
            </div>
        </form>
    </div>

    <table class="table table-bordered text-center shadow bg-white">
        <thead class="table-dark">
            <tr>
                <th>Número</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${espacios}">
                <td th:text="${e.numero}"></td>
                <td th:text="${e.estado}" th:class="${e.estado == 'DISPONIBLE' ? 'text-success fw-bold' : 'text-danger fw-bold'}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
