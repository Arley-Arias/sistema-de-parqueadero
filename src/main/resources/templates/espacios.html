<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table { border-radius: 8px; overflow: hidden; vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"><i class="fa-solid fa-square-parking"></i> Parqueadero</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/vehiculos}"><i class="fa-solid fa-car"></i> Carros/Motos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/panel/espacios}"><i class="fa-solid fa-border-all"></i> Puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/movimientos}"><i class="fa-solid fa-right-left"></i> Entradas/Salidas</a>
                </li>

                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/propietarios}"><i class="fa-solid fa-users"></i> Dueños</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/reportes}"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" th:if="${esAdmin}">
                    <a class="nav-link text-warning fw-bold" th:href="@{/panel/configuracion}"><i class="fa-solid fa-gear"></i> Ajustes</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button class="btn btn-light btn-sm fw-bold rounded-pill px-3 mt-1" type="submit">
                            <i class="fa-solid fa-power-off text-danger"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-primary fw-bold"><i class="fa-solid fa-border-all me-2"></i> Gestión de Espacios</h2>
    
    <div class="card shadow mb-5 border-top border-primary border-4" th:if="${esAdmin}">
        <div class="card-body p-4">
            <form th:action="@{/panel/espacios}" th:object="${nuevoEspacio}" method="post" class="row g-3 align-items-end">
                <div class="col-md-10">
                    <label class="form-label fw-bold text-secondary">Número o Código del Espacio</label>
                    <input type="text" th:field="*{numero}" class="form-control" placeholder="Ej: A1" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover text-center mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="fa-solid fa-hashtag text-muted"></i> Número</th>
                        <th><i class="fa-solid fa-circle-info text-muted"></i> Estado</th>
                        <th th:if="${esAdmin}"><i class="fa-solid fa-gears text-muted"></i> Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${espacios}">
                        <td class="fw-bold fs-5" th:text="${e.numero}"></td>
                        <td>
                            <span th:if="${e.estado == 'DISPONIBLE'}" class="badge bg-success rounded-pill px-3 py-2"><i class="fa-solid fa-check"></i> Disponible</span>
                            <span th:if="${e.estado == 'OCUPADO'}" class="badge bg-danger rounded-pill px-3 py-2"><i class="fa-solid fa-car"></i> Ocupado</span>
                            <span th:if="${e.estado == 'MANTENIMIENTO'}" class="badge bg-warning rounded-pill px-3 py-2 text-dark"><i class="fa-solid fa-triangle-exclamation"></i> Mantenimiento</span>
                        </td>
                        <td th:if="${esAdmin}">
                            <a th:if="${e.estado == 'DISPONIBLE'}" th:href="@{/panel/espacios/mantenimiento/{id}(id=${e.id})}" class="btn btn-warning btn-sm shadow-sm" title="Poner en Mantenimiento">
                                <i class="fa-solid fa-wrench"></i> Mantenimiento
                            </a>
                            <a th:if="${e.estado == 'MANTENIMIENTO'}" th:href="@{/panel/espacios/mantenimiento/{id}(id=${e.id})}" class="btn btn-success btn-sm shadow-sm" title="Habilitar Espacio">
                                <i class="fa-solid fa-check-double"></i> Habilitar
                            </a>
                            <a th:href="@{/panel/espacios/eliminar/{id}(id=${e.id})}" class="btn btn-danger btn-sm shadow-sm ms-1" onclick="return confirm('¿Seguro que quieres borrar este espacio?');" title="Eliminar Espacio">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
