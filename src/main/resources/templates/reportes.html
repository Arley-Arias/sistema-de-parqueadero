<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parqueadero - Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table { border-radius: 8px; overflow: hidden; vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"><i class="fa-solid fa-square-parking"></i> Parqueadero</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/vehiculos}"><i class="fa-solid fa-car"></i> Carros/Motos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/espacios}"><i class="fa-solid fa-border-all"></i> Puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/panel/movimientos}"><i class="fa-solid fa-right-left"></i> Entradas/Salidas</a>
                </li>

                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:href="@{/panel/propietarios}"><i class="fa-solid fa-users"></i> Dueños</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link active" th:href="@{/panel/reportes}"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-3" th:if="${esAdmin}">
                    <a class="nav-link text-warning fw-bold" th:href="@{/panel/configuracion}"><i class="fa-solid fa-gear"></i> Ajustes</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button class="btn btn-light btn-sm fw-bold rounded-pill px-3 mt-1" type="submit">
                            <i class="fa-solid fa-power-off text-danger"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-primary fw-bold"><i class="fa-solid fa-chart-pie me-2"></i> Reportes del Sistema</h2>
    
    <div class="row mt-4 mb-5">
        <div class="col-md-5">
            <div class="card text-white bg-success shadow rounded-4" style="background: linear-gradient(135deg, #20c997, #198754);">
                <div class="card-body p-4 d-flex align-items-center">
                    <div class="me-4">
                        <i class="fa-solid fa-sack-dollar fa-4x opacity-50"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1 text-white-50">Recaudo del Día</h5>
                        <h1 class="display-5 fw-bold mb-0">$<span th:text="${recaudoHoy != null ? #numbers.formatDecimal(recaudoHoy, 0, 'COMMA', 0, 'POINT') : '0'}"></span></h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mb-3 text-secondary fw-bold"><i class="fa-solid fa-car-on me-2"></i> Vehículos Activos en Parqueadero</h4>
    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover text-center mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="fa-solid fa-hashtag text-muted"></i> Placa</th>
                        <th><i class="fa-solid fa-border-all text-muted"></i> Espacio Asignado</th>
                        <th><i class="fa-regular fa-clock text-muted"></i> Hora de Entrada</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${activos}">
                        <td class="fw-bold" th:text="${m.placa}"></td>
                        <td><span class="badge bg-dark rounded-pill px-3 py-2 fs-6" th:text="${m.espacioAsignado}"></span></td>
                        <td class="text-success fw-bold" th:text="${#temporals.format(m.fechaEntrada, 'HH:mm')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(activos)}">
                        <td colspan="3" class="text-muted p-4">No hay vehículos en el parqueadero en este momento.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
